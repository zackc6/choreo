[project]
name = "choreoir"
version = "0.1.9"
description = "Typed kernel choreography IR: Lintel's L4 compiler object (check, sim, lower to NVIDIA GPU and Ascend NPU)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
choreo = "choreoir.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["choreoir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

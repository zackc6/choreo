[project]
name = "choreoir"
version = "0.1.0"
description = "Typed L4 kernel choreography IR (data plane). Not an agent runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["choreoir*"]

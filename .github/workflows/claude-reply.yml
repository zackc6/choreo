name: Wake Claude when ChatGPT writes in the review thread

# Event-driven half of the two-agent debate (see AGENTS.md). Same mechanism as
# zackc6/ai-compiler-survey. ChatGPT pushes a Review-thread entry to STATUS.md on main
# -> Claude verifies, replies in the thread, and merges an agreed claude/* branch.
# Commits pushed with GITHUB_TOKEN do not re-trigger workflows, so Claude cannot wake itself.

on:
  push:
    branches: [main]
    paths: [STATUS.md]
  repository_dispatch:
    types: [chatgpt_replied]

permissions:
  contents: write
  id-token: write

concurrency:
  group: debate
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect a new ChatGPT entry in the Review thread
        id: detect
        run: |
          set -e
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "Codex explicitly requested a reply."; exit 0
          fi
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          added=$(git diff --unified=0 ${{ github.event.before }} ${{ github.sha }} -- STATUS.md | grep -E '^\+\*\*[0-9]{4}-[0-9]{2}-[0-9]{2}[^*]*ChatGPT' || true)
          if [ -n "$added" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; echo "New ChatGPT entry detected."; else echo "No new ChatGPT entry."; fi

      - name: Claude reviews and replies
        if: steps.detect.outputs.found == 'true'
        uses: anthropics/claude-code-action/base-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are Claude, co-maintaining zackc6/choreo with a ChatGPT agent under the
            debate-then-merge protocol in AGENTS.md. Read AGENTS.md first, then the Open batch table
            and the Review thread at the top of STATUS.md. This repository is one of four
            (ai-compiler-survey, lintel, choreo, agentic-compiler); respect the ownership table.

            ChatGPT has just written a new entry in the Review thread. Your job, in order:
            1. Verify. Check at least two concrete claims in its entry against the files, the
               validation gate, or (for survey references) the primary source. Say which held.
            2. Think. Engage its position on the merits using the "What a batch must say" items in
               AGENTS.md. Change your position when its argument is better; hold it when not; name
               the strongest objection to your own reading.
            3. Reply. Add one dated entry at the TOP of the Review thread in STATUS.md (newest first),
               headed "**<date> <time> UTC — Claude (GitHub Action)**": verdict items first, then
               agree/object per point with file and line, resolved points marked with commit hashes,
               and what happens next. Never change a contract field, Kernel encoding, compiler_ver,
               or a measurement label unless the thread already records agreement.
            4. Merge only on agreement. If ChatGPT wrote "AGREE to merge" for an open claude/* branch
               named in the Open batch table, and every ask in Claude's entry for that branch is
               agreed: git fetch, check out the branch, run the validation gate from AGENTS.md
               (python3 -m pip install -q -e '.[dev]' && python3 -m pytest -q), then SQUASH it into main (`git merge --squash <branch>` then one commit)
               with a git-log-readable message. Run the gate again on main, clear the Open batch row,
               write a "MERGE SUMMARY" entry at the top of the Review thread (alignment first, then
               changes, agreement record, commit hash; email: pending), delete the merged remote
               branch and any draft it superseded (`git push origin --delete <branch>`), and verify
               with `git ls-remote --heads origin`. If anything fails, do not merge; say why.
            5. If ChatGPT objected to something on Claude's branch and its facts hold, fix it on the
               branch (not on main), push the branch, and say so in the thread.
            6. Commit with git (user.name "Claude (GitHub Action)"), message ending in
               "Co-Authored-By: Claude (GitHub Action)"; push with `git push origin HEAD:main` /
               `git push origin <branch>`. Never force-push. Stop after one reply; do not loop.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,WebFetch,Bash(git:*),Bash(python3:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(diff:*)"

      - name: Push Claude's reply (the base action does not commit)
        if: steps.detect.outputs.found == 'true'
        run: |
          git config user.name "Claude (GitHub Action)"
          git config user.email "claude-action@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Claude made no file changes."; exit 0; fi
          git commit -m "Claude (GitHub Action): reply in the review thread" -m "Co-Authored-By: Claude (GitHub Action)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Wake Codex for another round if Claude replied
        if: steps.detect.outputs.found == 'true' && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        env:
          DEBATE_BRANCH: ${{ github.event.client_payload.branch }}
          DEBATE_ROUND: ${{ github.event.client_payload.round }}
          STATUS_BEFORE: ${{ github.event.client_payload.status_file_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const branch = process.env.DEBATE_BRANCH || '';
            const round = Number(process.env.DEBATE_ROUND);
            if (!/^claude\/[A-Za-z0-9._\/-]+$/.test(branch) || !(round >= 1 && round <= 3)) {
              core.warning('No valid Claude debate branch/round; not dispatching.'); return;
            }
            const status = await github.rest.repos.getContent({owner, repo, path: 'STATUS.md', ref: 'main'});
            if (status.data.sha === process.env.STATUS_BEFORE) {
              core.warning('Claude did not publish a STATUS.md reply; stopping debate loop.'); return;
            }
            if (round >= 3) { core.notice('Reached max debate rounds.'); return; }
            try { await github.rest.repos.getBranch({owner, repo, branch}); }
            catch (err) { if (err.status === 404) { core.notice('Branch merged/deleted.'); return; } throw err; }
            await github.rest.repos.createDispatchEvent({
              owner, repo, event_type: 'claude_replied', client_payload: {branch, round: round + 1}
            });

name: test
on:
  push:
    branches: [main, 'claude/**', 'chatgpt/**']
jobs:
  carriers:
    runs-on: ubuntu-24.04  # nvcc 12.8 rejects the Ubuntu 26 host gcc (ubuntu-latest migrated 2026-10-19)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache/restore@v4
        id: cache-nvcc
        with:
          path: ~/.local/cuda-nvcc
          key: cuda-nvcc-linux-x86_64-12.8.93-cudart-12.8.90
      - run: python3 -m pip install -e .
      - name: Official nvcc (NVIDIA cubin sink)
        env:
          CHOREO_FETCH_NVCC: "1"
        run: |
          python3 -c "from choreoir.toolchain import ensure_nvcc; import sys; p=ensure_nvcc(); print(p or 'nvcc-missing'); sys.exit(0 if p else 1)"
          echo "$HOME/.local/cuda-nvcc/bin" >> "$GITHUB_PATH"
          "$HOME/.local/cuda-nvcc/bin/nvcc" -V
      - uses: actions/cache/save@v4
        if: steps.cache-nvcc.outputs.cache-hit != 'true'
        with:
          path: ~/.local/cuda-nvcc
          key: cuda-nvcc-linux-x86_64-12.8.93-cudart-12.8.90
      - name: carrier check (examples admit + lower; fails reject; V where paired)
        run: python3 scripts/check_carriers.py
      - name: cubin sink smoke (official nvcc; ccec not a public redist)
        run: |
          python3 -m choreoir lower examples/gemm.json -o /tmp/choreo-out --emit cubin
          test -s /tmp/choreo-out/*.cubin || { echo "no cubin emitted"; ls -la /tmp/choreo-out; exit 1; }
        shell: bash
        # IR-design stage: carriers are illustrative, not a correctness contract (AGENTS.md).

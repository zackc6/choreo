name: test
on:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.local/cuda-nvcc
          key: cuda-nvcc-linux-x86_64-12.8.93-cudart-12.8.90
          save-always: true
      - run: python3 -m pip install -e ".[dev]"
      - name: Official nvcc (NVIDIA cubin sink)
        env:
          CHOREO_FETCH_NVCC: "1"
        run: |
          python3 -c "from choreoir.toolchain import ensure_nvcc; import sys; p=ensure_nvcc(); print(p or 'nvcc-missing'); sys.exit(0 if p else 1)"
          echo "$HOME/.local/cuda-nvcc/bin" >> "$GITHUB_PATH"
      - name: pytest (cubin required; ccec not a public redist)
        env:
          CHOREO_REQUIRE_NVCC: "1"
        run: python3 -m pytest -q -rs
        # Ascend NPU-bin tests skip here. Missing nvcc fails the job.
